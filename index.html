<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes">
<title>跑步教練</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>🏃 跑步教練</h1></header>
<nav><button data-tab="log" class="on">紀錄</button><button data-tab="fit">體能</button><button data-tab="plan">課表</button><button data-tab="coach">教練</button></nav>
<main>
<section id="log" class="tab on">
 <form id="runForm" class="card"><h2 id="formTitle">新增跑步</h2>
  <input type="hidden" id="editId">
  <label>日期<input type="date" id="fDate" required></label>
  <label>距離 (公里)<input type="number" id="fDist" step="0.01" min="0.1" required inputmode="decimal"></label>
  <label>時間 (h:mm:ss)<input id="fTime" placeholder="0:50:00" pattern="\d{1,2}:\d{2}(:\d{2})?" required></label>
  <label>平均心率<input type="number" id="fHr" min="40" max="230" inputmode="numeric"></label>
  <label>備註<input id="fNote" maxlength="200"></label>
  <div class="pace" id="fPace">配速：—</div>
  <div class="row"><button type="submit">儲存</button><button type="button" id="cancelEdit" class="ghost" hidden>取消</button></div>
 </form>
 <div class="card"><h2>Garmin 匯入</h2><p class="muted">從 Garmin Connect 匯出 Activities.csv、GPX 或 FIT 檔後上傳（重複的日期＋距離會自動略過）。</p>
  <label class="filebtn">選擇檔案<input type="file" id="garminFile" accept=".csv,.gpx,.fit" multiple hidden></label>
  <div id="importMsg" class="muted"></div></div>
 <div class="card"><h2>跑步紀錄 <span id="runCount" class="muted"></span></h2><ul id="runList" class="list"></ul></div>
</section>
<section id="fit" class="tab">
 <div class="card"><h2>近期比賽成績</h2>
  <div class="row"><select id="raceDist"><option value="5">5K</option><option value="10">10K</option><option value="21.0975">半馬</option><option value="42.195" selected>全馬</option></select>
  <input id="raceTime" placeholder="4:03:00"><input type="date" id="raceDate"></div>
  <button id="saveRace">儲存比賽成績</button></div>
 <div class="card"><h2>成績預測</h2><div id="predict"></div></div>
</section>
<section id="plan" class="tab">
 <div class="card"><h2>目標賽事</h2>
  <label>距離<select id="gDist"><option value="5">5K</option><option value="10">10K</option><option value="21.0975">半馬</option><option value="42.195" selected>全馬</option></select></label>
  <label>比賽日期<input type="date" id="gDate"></label>
  <label>目標時間<input id="gTime" placeholder="3:59:00"></label>
  <label>每週跑步天數<select id="gDays"><option>3</option><option>4</option><option selected>5</option><option>6</option></select></label>
  <button id="genPlan">產生課表</button></div>
 <div id="planOut"></div>
</section>
<section id="coach" class="tab">
 <div class="card"><h2>AI 教練建議</h2><div id="tips"></div></div>
 <div class="card"><h2>LLM 設定（選用）</h2><p class="muted">目前使用內建規則。未來可填入 OpenAI 相容 API 端點與金鑰，取得更個人化建議；金鑰只存在本機瀏覽器。</p>
  <label>API 端點<input id="llmUrl" placeholder="https://api.openai.com/v1/chat/completions"></label>
  <label>模型<input id="llmModel" placeholder="gpt-4o-mini"></label>
  <label>API 金鑰<input id="llmKey" type="password"></label>
  <div class="row"><button id="saveLlm">儲存</button><button id="askLlm" class="ghost">詢問 LLM</button></div>
  <div id="llmOut"></div></div>
 <div class="card"><h2>資料</h2><div class="row"><button id="exportBtn" class="ghost">匯出 JSON</button><button id="clearBtn" class="danger">清除全部</button></div></div>
</section>
</main>
<script src="garmin-import.js"></script><script src="app.js"></script></body></html>
